[project]
name = "sewsure-contracts"
version = "1.0.0.dev1"
description = "SewSure API contract v1 (DRAFT): generated Pydantic models for services/api."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.8"]

[project.optional-dependencies]
dev = [
  "datamodel-code-generator[http]>=0.26",
  "jsonschema[format-nongpl]>=4.23",
  "referencing>=0.35",
  "openapi-spec-validator>=0.7",
  "pyyaml>=6",
  "pytest>=8",
  "pyright>=1.1.380",
  "black>=24",
  "isort>=5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["generated/python/sewsure_contracts"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
include = ["generated/python", "scripts", "tests"]
pythonVersion = "3.12"
extraPaths = ["scripts", "generated/python"]
