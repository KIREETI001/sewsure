[project]
name = "sewsure-api"
version = "0.1.0"
description = "SewSure API service: auth, persistence, orchestration."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "jsonschema>=4",  # K3: AI output validation (ai/)
    "sewsure-contracts",
    "sewsure-feasibility",
]

[tool.uv.sources]
sewsure-contracts = { path = "../../packages/contracts", editable = true }
sewsure-feasibility = { path = "../../packages/feasibility", editable = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.6",
    "pyright>=1.1.380",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sewsure_api"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header"]


[tool.pyright]
include = ["sewsure_api", "tests", "migrations"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests", "ai"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*" = ["E501", "UP", "I"]
