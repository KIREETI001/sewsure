name: CI Mobile

# Lint, type-check and unit test the Expo app. Skips until apps/mobile has a package.json.
# Maestro end-to-end flows run on a device matrix, not here (D6).

on:
  pull_request:
    paths:
      - "apps/mobile/**"
      - "packages/contracts/**"
      - ".github/workflows/ci-mobile.yml"
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "packages/contracts/**"
      - ".github/workflows/ci-mobile.yml"

permissions:
  contents: read

concurrency:
  group: ci-mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - name: Detect app
        id: detect
        run: |
          if [ -f package.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::apps/mobile has no package.json yet; skipping."
          fi

      - name: Set up Node
        if: steps.detect.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install
        if: steps.detect.outputs.exists == 'true'
        run: npm ci

      - name: Lint
        if: steps.detect.outputs.exists == 'true'
        run: npm run --if-present lint

      - name: Type-check
        if: steps.detect.outputs.exists == 'true'
        run: npx --no-install tsc --noEmit

      - name: Jest
        if: steps.detect.outputs.exists == 'true'
        run: npm test --if-present -- --ci
