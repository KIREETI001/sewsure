      text: Maker or owner
    direction: DOWN
- tapOn: Maker or owner
- scrollUntilVisible:
    element:
      text: Try demo mode
    direction: DOWN
- tapOn: Try demo mode
- scrollUntilVisible:
    element:
      text: Start
    direction: DOWN
- tapOn: Start
- scrollUntilVisible:
    element:
      text: "Take photo: Front"
    direction: DOWN
- tapOn: "Take photo: Front"
- assertVisible:
    text: Camera access is off.*
- assertVisible:
    text: Open settings
- assertVisible:
    text: "Choose from library: Front"
