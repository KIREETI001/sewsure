# STATUS: UNVERIFIED ON ANDROID. Reconciled in Milestone 2; never executed on a device/emulator.
# MOCK FAILURE ONLY. No network request or airplane mode. Live-network case: ../future/live-network-failure.md.
appId: com.sewsure.mobile
---
- runFlow:
    file: ../seed/apply.yaml
    env:
      SEED: measurements-confirmed
- tapOn: (?i)Enable mock upload failure
- assertVisible:
    text: "Mock upload failure: enabled"
- scrollUntilVisible:
    element:
      text: Upload
    direction: DOWN
- tapOn: Upload
- scrollUntilVisible:
    element:
      text: Upload failed\. Your draft is still saved on this device\.
    direction: UP
- assertVisible:
    text: Upload failed\. Your draft is still saved on this device\.
- scrollUntilVisible:
    element:
      text: "Confirmed: 52 cm"
    direction: DOWN
- assertVisible:
    text: "Confirmed: 52 cm"
- tapOn: (?i)Disable mock upload failure
- assertVisible:
    text: "Mock upload failure: disabled"
- scrollUntilVisible:
    element:
      text: Try upload again
    direction: DOWN
- tapOn: Try upload again
- scrollUntilVisible:
    element:
      text: Test upload only\. Nothing left this device\.
    direction: UP
- assertVisible:
    text: Test upload only\. Nothing left this device\.
- assertVisible:
    text: Sample data, not a real result
- assertNotVisible: Uploaded
- scrollUntilVisible:
    element:
      text: "Confirmed: 52 cm"
    direction: DOWN
- assertVisible:
    text: "Confirmed: 52 cm"
